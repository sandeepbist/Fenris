[project]
name = "fenris"
version = "0.1.0"
description = "RAG over your own Google Drive: revision-aware, evidence-cited, locally indexed."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "sqlite-vec>=0.1.6",
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "keyring>=25",
    "docling>=2.0",
    "google-genai>=1.0",
    "flashrank>=0.2.5",
    "ir-measures>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "ruff>=0.6",
]

[project.scripts]
fenris = "fenris.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fenris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
