[project]
name = "fenris-drive"
version = "1.0.0"
description = "RAG over your own Google Drive: revision-aware, evidence-cited, locally indexed."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Fenris contributors" }]
keywords = ["rag", "google-drive", "search", "citations", "local-first", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Indexing",
]
# NOTE: `docling` (full) pulls docling-ibm-models -> torch + 15 nvidia-* CUDA wheels
# (~4.5 GB). This is a CPU-only tool; after any dependency change run:
#   .venv/bin/pip uninstall -y docling-ibm-models torch torchvision triton nvidia-cublas \
#     nvidia-cuda-cupti nvidia-cuda-nvrtc nvidia-cuda-runtime nvidia-cudnn-cu13 nvidia-cufft \
#     nvidia-cufile nvidia-cur nvidia-cusolver nvidia-cusparse nvidia-cusparselt-cu13 \
#     nvidia-nccl-cu13 nvidia-nvjitlink nvidia-nvshmem-cu13 nvidia-nvtx accelerate
# and verify `python -c "from docling.document_converter import DocumentConverter"`
# plus the test suite still pass. Storage on this machine is constrained.
dependencies = [
    "typer>=0.12",
    "sqlite-vec>=0.1.6",
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "keyring>=25",
    "docling>=2.0",
    "google-genai>=1.0",
    "flashrank>=0.2.5",
    "ir-measures>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/sandeepbist/Fenris"
Repository = "https://github.com/sandeepbist/Fenris"
Issues = "https://github.com/sandeepbist/Fenris/issues"
Changelog = "https://github.com/sandeepbist/Fenris/blob/master/CHANGELOG.md"
Documentation = "https://github.com/sandeepbist/Fenris/blob/master/docs/architecture.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
fenris = "fenris.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fenris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
