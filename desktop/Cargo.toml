[package]
name = "fenris-desktop"
version = "1.0.0"
edition = "2021"
description = "Fenris desktop shell: spawns the Python engine sidecar and serves the UI"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"

[profile.release]
lto = true
strip = true
