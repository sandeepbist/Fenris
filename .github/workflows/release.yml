name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true
      skip_pypi:
        description: "Skip the PyPI upload"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  # One gate for every release channel: the suite must be green on the
  # exact commit being shipped. No artifacts leave the building otherwise.
  verify:
    name: Release gate (full suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip uninstall -y docling-ibm-models torch torchvision triton accelerate 2>/dev/null || true

      - run: python -m ruff check src tests

      - run: python -m pytest
        env:
          FENRIS_DIGEST_SCHEDULER: "0"

  wheel:
    name: Python wheel + sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  pypi:
    name: PyPI (fenris-drive)
    needs: wheel
    if: ${{ !inputs.skip_pypi }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # arm64 + x86_64
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-latest
            args: ""
          - os: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: oven-sh/setup-bun@v2

      - name: Install engine deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller
          python -m pip uninstall -y docling-ibm-models torch torchvision triton accelerate 2>/dev/null || true

      - name: Build engine sidecar (PyInstaller)
        run: |
          bash desktop/build-engine.sh ${{ runner.arch == 'ARM64' && 'aarch64-apple-darwin' || '' }}
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name || format('v{0}', inputs.version) }}
          releaseName: "Fenris ${{ github.ref_name || inputs.version }}"
          releaseBody: "See [CHANGELOG.md](CHANGELOG.md) for the full notes."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
